name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.ref }}

jobs:
  build:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: windows
            arch: x64
            executable: dist/app.dist/PhotonSnapshot.exe
          - os: macos-15-intel
            platform: macos
            arch: x64
            executable: dist/app.app/Contents/MacOS/PhotonSnapshot
          - os: macos-15
            platform: macos
            arch: arm64
            executable: dist/app.app/Contents/MacOS/PhotonSnapshot
          - os: ubuntu-24.04
            platform: linux
            arch: x64
            executable: dist/app.dist/PhotonSnapshot

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: ${{ matrix.arch }}
          cache: pip

      - name: Check target architecture and version
        id: version
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          python - <<'PY'
          import os
          import platform
          import re
          import sys

          sys.path.insert(0, "src")
          from app_info import APP_VERSION

          machine = platform.machine().lower()
          arch = {"amd64": "x64", "x86_64": "x64", "aarch64": "arm64"}.get(machine, machine)
          if arch != os.environ["TARGET_ARCH"]:
              sys.exit(f"Expected {os.environ['TARGET_ARCH']}, got {machine}")
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", APP_VERSION):
              sys.exit(f"Invalid package version: {APP_VERSION}")
          if os.environ["GITHUB_REF_TYPE"] == "tag" and os.environ["GITHUB_REF_NAME"] != f"v{APP_VERSION}":
              sys.exit(f"Release tag must be v{APP_VERSION}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"value={APP_VERSION}", file=output)
          PY

      - name: Install Linux build and Qt libraries
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential patchelf libdbus-1-3 libegl1 libfontconfig1 \
            libgl1 libglib2.0-0t64 libgssapi-krb5-2 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1

      - name: Install Python dependencies
        run: python build.py --install

      - name: Compile translation catalogs
        run: |
          python scripts/extract_strings.py
          python scripts/build_po.py
          python scripts/compile_lang.py

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Build executable
        run: python build.py

      - name: Verify packaged executable
        shell: bash
        env:
          APP_EXECUTABLE: ${{ matrix.executable }}
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess

          smoke_dir = Path("dist/codec-smoke")
          executable = Path(os.environ["APP_EXECUTABLE"]).resolve()
          completed = subprocess.run([str(executable), "--self-test", str(smoke_dir)])
          report = smoke_dir / "release-smoke.json"
          if report.is_file():
              print(report.read_text(encoding="utf-8"))
          completed.check_returncode()
          result = json.loads(report.read_text(encoding="utf-8"))
          if not result["passed"] or result["version"] != os.environ["PACKAGE_VERSION"]:
              raise SystemExit(f"Unexpected packaged smoke result: {result}")
          PY

      - name: Install signing dependency
        run: python -m pip install cryptography

      - name: Sign executable and generate release manifest
        shell: bash
        env:
          APP_EXECUTABLE: ${{ matrix.executable }}
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
          TARGET_PLATFORM: ${{ matrix.platform }}
          TARGET_ARCH: ${{ matrix.arch }}
          PHOTON_SIGNING_PRIVATE_KEY: ${{ secrets.PHOTON_SIGNING_PRIVATE_KEY }}
        run: |
          output_dir="${APP_EXECUTABLE%/*}"
          member="${APP_EXECUTABLE##*/}"
          signature="$member.sig"
          if [[ "$TARGET_PLATFORM" == macos ]]; then
            # Keep detached signing files outside the code-signed app bundle.
            output_dir=dist/dmg
            member="PhotonSnapshot.app/Contents/MacOS/$member"
          fi
          mkdir -p "$output_dir" artifacts
          manifest="$output_dir/$TARGET_PLATFORM-$TARGET_ARCH-manifest.json"
          python scripts/sign_release.py sign "$APP_EXECUTABLE" "$output_dir/$signature" "$manifest" \
            --version "$PACKAGE_VERSION" --member "$member"
          cp "$manifest" artifacts/

      - name: Locate WiX Toolset
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          if (-not (Get-Command heat.exe -ErrorAction SilentlyContinue)) {
            $bin = Join-Path ${env:ProgramFiles(x86)} 'WiX Toolset v3.14\bin'
            if (-not (Test-Path (Join-Path $bin 'heat.exe'))) {
              throw 'WiX Toolset 3.14 is missing from the runner.'
            }
            $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Package and verify Windows release
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          $version = $env:PACKAGE_VERSION
          .\installer\windows\build-msi.ps1 -SourceDir dist\app.dist -OutputDir dist\installer -Version $version
          $msi = "dist\installer\PhotonSnapshot-$version.msi"
          .\scripts\verify_windows_package.ps1 -MsiPath $msi -ReportDir dist\installer-smoke
          Copy-Item -LiteralPath $msi -Destination artifacts
          Compress-Archive -Path dist\app.dist -DestinationPath "artifacts\PhotonSnapshot-$version-windows-x64.zip"

      - name: Package macOS release
        if: matrix.platform == 'macos'
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p artifacts dist/dmg
          ditto dist/app.app dist/dmg/PhotonSnapshot.app
          python scripts/sign_release.py verify \
            dist/dmg/PhotonSnapshot.app/Contents/MacOS/PhotonSnapshot dist/dmg/PhotonSnapshot.sig
          ln -s /Applications dist/dmg/Applications
          dmg="artifacts/PhotonSnapshot-$PACKAGE_VERSION-macos-$TARGET_ARCH.dmg"
          hdiutil create -volname "Photon Snapshot" -srcfolder dist/dmg -fs HFS+ -format UDZO "$dmg"
          hdiutil verify "$dmg"

      - name: Package Linux release
        if: matrix.platform == 'linux'
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          mkdir -p artifacts
          tar -czf "artifacts/PhotonSnapshot-$PACKAGE_VERSION-linux-x64.tar.gz" -C dist app.dist

      - name: Upload release packages
        uses: actions/upload-artifact@v7
        with:
          name: photon-snapshot-${{ matrix.platform }}-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish GitHub release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: photon-snapshot-*
          path: release-artifacts
          merge-multiple: true

      - name: Publish verified release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$GITHUB_REF_NAME"
          prefix="release-artifacts/PhotonSnapshot-${tag#v}"
          assets=(
            "$prefix.msi"
            "$prefix-windows-x64.zip"
            "$prefix-macos-x64.dmg"
            "$prefix-macos-arm64.dmg"
            "$prefix-linux-x64.tar.gz"
            "release-artifacts/windows-x64-manifest.json"
            "release-artifacts/macos-x64-manifest.json"
            "release-artifacts/macos-arm64-manifest.json"
            "release-artifacts/linux-x64-manifest.json"
          )
          for asset in "${assets[@]}"; do
            if [[ ! -s "$asset" ]]; then
              echo "Missing release asset: $asset" >&2
              exit 1
            fi
          done

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" --verify-tag --draft \
              --title "Photon Snapshot $tag" --generate-notes
          fi
          gh release edit "$tag" --draft=false
